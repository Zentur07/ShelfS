name: ShelfS PostgreSQL tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shelfs
          POSTGRES_USER: shelfs
          POSTGRES_PASSWORD: temporary-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shelfs -d shelfs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: shelfs
      DB_USER: shelfs
      DB_PASSWORD: temporary-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
